spring:
  main:
    lazy-initialization: true
  autoconfigure:
    exclude:
#      - org.springframework.boot.actuate.autoconfigure.endpoint.EndpointAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.endpoint.web.WebEndpointAutoConfiguration
#      - org.springframework.boot.actuate.autoconfigure.endpoint.jmx.JmxEndpointAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.info.InfoContributorAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3306/${spring.datasource.name}?useSSL=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useConfigs=maxPerformance
    username: root
    password: 666666
    name: geek_data
    driver-class-name: com.mysql.cj.jdbc.Driver
    Hikari:
      connection-timeout: 1000
      maximum-pool-size: 5
      minimum-idle: 2
      initialization-fail-timeout: 1000
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true
    properties:
      hibernate:
#        format_sql: true
        # 禁用字节码增强
        bytecode:
          provider: none
        enhancer:
          enable: false
        # 禁用实体验证（开发环境）
        check_nullability: false

server:
  port: 8080
  servlet:
    context-path: /api
  # 禁用不必要的 Tomcat 功能
  tomcat:
    # 减少线程池预热（开发环境）
    threads:
      min-spare: 1  # 默认 10
    max-connections: 1000  # 默认 10000，减少连接池预热
    accept-count: 100      # 默认 100，连接队列
    connection-timeout: 2000  # 2秒超时
    # 禁用静态资源缓存预热
    resource:
      cache-ttl: 0
  # 禁用 SSL（如果不用 HTTPS）
  ssl:
    enabled: false

logging:
  level:
    vip.geekclub: DEBUG
    sun.rmi.transport.tcp: ERROR

management:
  endpoints:
    web:
      exposure:
        include: ""  # 空字符串 = 不暴露任何端点
      base-path: /actuator
  # 禁用所有端点的缓存（减少启动时初始化）
  endpoint:
    health:
      cache:
        time-to-live: 0ms  # 禁用缓存

config:
  # JWT配置
  jwt:
    secret-key: ${JWT_SECRET_KEY:Geek2024SecurityDianComChina12987T23001Y-Q8Y05OOD}
    expiration-days: ${JWT_EXPIRATION_DAYS:7}
    issuer: geekclub.vip
  # 微信小程序配置
  wechat:
    mini-program:
      app-id: ${WECHAT_APP_ID:wx4169de1d28757b63}
